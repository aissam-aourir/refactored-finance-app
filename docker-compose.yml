version: '3.8'

services:
  finance-app:
    build: .
    container_name: refactored-finance-app
    image: refactored-finance-app:latest
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "8080:8080"
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
  
